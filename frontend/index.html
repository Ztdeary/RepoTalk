<!--浏览器加载的入口页面,只提供一个<div id="root">挂载点和加载/src/main.tsx的脚本标签。-->
<!doctype html>
<html lang="zh-CN">
  <!-- lang="zh-CN":告诉搜索引擎和浏览器页面主要语言是简体中文 -->
  <head>
    <!-- charset="UTF-8":声明页面字符编码为UTF-8,确保中文不乱码 -->
    <meta charset="UTF-8" />
    <!-- viewport:移动端适配,width=device-width让页面宽度等于设备宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器标签页标题 -->
    <title>RepoTalk</title>
  </head>
  <body>
    <!-- id="root":React应用的挂载点,main.tsx里getElementById('root')找的就是它 -->
    <div id="root"></div>
    <!-- type="module":告诉浏览器这是ES Module,支持import语法 -->
    <!-- src="/src/main.tsx":Vite会自动处理.tsx文件的编译 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
