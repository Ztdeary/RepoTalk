# ============================================================
# Nginx 反代配置 —— RepoTalk 生产环境部署
#
# 作用:
#   1. 托管前端静态文件(frontend/dist/)
#   2. 把 /api/* 请求反代到后端 FastAPI(8000 端口)
#   3. 支持 SSE 流式响应(/chat/stream, /repos/{id}/events)
#   4. gzip 压缩,减小传输体积
#   5. 可选 HTTPS(用 Let's Encrypt 证书)
# ============================================================

# ---- 全局块 ----
# worker_processes:auto 让 Nginx 自动按 CPU 核数开 worker 进程
worker_processes auto;

# 错误日志位置(容器内)
error_log /var/log/nginx/error.log warn;

# PID 文件位置
pid /var/run/nginx.pid;

# ---- events 块:连接级配置 ----
events {
    worker_connections 1024;
    # worker_connections:每个 worker 进程最多同时处理的连接数
    # 1024 对中小项目够用,大项目可以调到 4096+
}

# ---- http 块:HTTP 服务级配置 ----
http {
    # ---- 基础配置 ----
    include       /etc/nginx/mime.types;   # 包含 MIME 类型映射表
    default_type  application/octet-stream; # 默认 MIME 类型,文件类型未知时用

    # 日志格式:记录请求时间、状态码、响应大小、耗时
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # ---- 性能优化 ----
    sendfile on;          # sendfile:零拷贝传输静态文件,减少 CPU 拷贝
    tcp_nopush on;        # tcp_nopush:配合 sendfile,攒满包再发,减少包数
    tcp_nodelay on;       # tcp_nodelay:禁用 Nagle 算法,小包立即发(SSE 必须开)
    keepalive_timeout 65; # keepalive_timeout:长连接超时 65 秒

    # ---- gzip 压缩 ----
    gzip on;                    # 开启 gzip 压缩
    gzip_vary on;               # 响应头加 Vary: Accept-Encoding,让缓存服务器区分压缩/非压缩
    gzip_min_length 1024;       # 小于 1KB 的文件不压缩(压缩开销大于收益)
    gzip_proxied any;           # 对反代的响应也压缩
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    # gzip_types:指定哪些 MIME 类型要压缩(文本类压缩率高,图片/视频已是压缩格式不压)

    # ---- 上游服务器定义 ----
    # 后端 FastAPI 服务,跑在 8000 端口
    upstream backend {
        server backend:8000;
        # server:指定上游服务器地址
        # 如果后端有多实例,可以写多行做负载均衡
        # 127.0.0.1:8000 假设 Nginx 和后端在同一台机器/容器网络里
    }

    # ---- HTTP 服务器块(80 端口) ----
    server {
        listen 80;                              # listen:监听 80 端口
        server_name _;                          # server_name:匹配所有域名(_ 是通配)
        client_max_body_size 50m;               # client_max_body_size:请求体最大 50MB(仓库上传可能较大)

        # ---- 前端静态文件 ----
        root /usr/share/nginx/html;             # root:静态文件根目录
        index index.html;                       # index:默认首页

        # 前端路由:所有非文件请求都返回 index.html(React Router 的 history 模式)
        location / {
            try_files $uri $uri/ /index.html;
            # try_files:按顺序尝试找文件
            # $uri:请求的路径对应的文件
            # $uri/:请求路径对应的目录
            # /index.html:都找不到就返回 index.html,让前端路由处理
        }

        # ---- API 反代:把 /api/* 转发到后端 ----
        location /api/ {
            proxy_pass http://backend/;
            # proxy_pass:反代目标地址
            # 注意末尾的 / :把 /api/ 前缀去掉再转发
            # 例如 /api/health -> http://backend/health

            proxy_set_header Host $host;
            # Host:把原始请求的 Host 头传给后端
            # 后端可能需要知道原始域名(生成链接、CORS 等)

            proxy_set_header X-Real-IP $remote_addr;
            # X-Real-IP:把客户端真实 IP 传给后端
            # $remote_addr 是 Nginx 看到的客户端 IP

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # X-Forwarded-For:追加客户端 IP 到转发链
            # $proxy_add_x_forwarded_for 会把已有 XFF 和 remote_addr 拼起来

            proxy_set_header X-Forwarded-Proto $scheme;
            # X-Forwarded-Proto:告诉后端原始协议是 http 还是 https

            # ---- SSE 流式响应专用配置 ----
            proxy_buffering off;
            # proxy_buffering off:关闭代理缓冲
            # SSE 要求后端一产生数据就立刻转发,缓冲会把多条消息攒一起发
            # 这是 SSE 能实时推送的关键

            proxy_cache off;
            # proxy_cache off:关闭代理缓存(SSE 不能缓存)

            proxy_read_timeout 300s;
            # proxy_read_timeout:读取后端响应的超时
            # SSE 长连接可能很久没数据,设大一点避免被掐断
            # 300 秒 = 5 分钟,配合后端的 15 秒心跳足够

            proxy_http_version 1.1;
            # proxy_http_version 1.1:用 HTTP/1.1 协议
            # HTTP/1.0 不支持长连接,SSE 必须用 1.1

            chunked_transfer_encoding on;
            # chunked_transfer_encoding on:开启分块传输编码
            # SSE 的响应体是流式的,长度未知,必须用分块传输
        }

        # ---- 健康检查接口直连(不经过 /api 前缀) ----
        location = /health {
            proxy_pass http://backend/health;
            # 直接把 /health 转发到后端的 /health
            # 方便负载均衡器/容器编排探活
        }
    }
}
